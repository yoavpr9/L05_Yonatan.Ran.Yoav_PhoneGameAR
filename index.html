<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>שריפה בכיתה - משחק AR</title>
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>
<video id="cam" playsinline muted autoplay></video>
<canvas id="gl"></canvas>
<canvas id="fx"></canvas>

<!-- מסך פתיחה -->
<section id="start" class="screen">
  <h1>שריפה בכיתה</h1>
  <p class="sub">משחק מציאות רבודה</p>
  <button id="btnPlay" class="big">התחל משחק</button>
  <button id="btnSetup" class="big ghost">סריקת אובייקטים</button>
  <p id="scanStatus" class="note"></p>
  <p id="loadStatus" class="note">טוען...</p>
  <p class="note" id="version">גרסה 7</p>
</section>

<!-- מסך סריקה (הגדרה) -->
<section id="setup" class="panel hidden">
  <div class="banner" id="setupMsg">כוון את המצלמה אל האובייקט, לחץ והחזק את הכפתור שלו, וזוז מעט סביבו (זוויות ומרחקים שונים). 20 דגימות ומעלה לכל אובייקט.</div>
  <div id="liveGuess" class="guess">-</div>
  <div class="grid">
    <button class="cap" data-label="door">ידית דלת<span>0</span></button>
    <button class="cap" data-label="ac">מקרן<span>0</span></button>
    <button class="cap" data-label="station">עמדת כיבוי<span>0</span></button>
    <button class="cap" data-label="bg">רקע (כל השאר)<span>0</span></button>
  </div>
  <div class="row">
    <button id="btnExport">ייצוא</button>
    <button id="btnImport">ייבוא</button>
    <button id="btnClear">מחק</button>
    <button id="btnBack">חזרה</button>
  </div>
  <input id="fileImport" type="file" accept="application/json,.json" hidden>
</section>

<!-- תצוגת משחק -->
<section id="hud" class="hidden">
  <div class="banner" id="msg"></div>
  <div id="timer">0.0</div>
  <button id="btnEnter" class="big hidden">נכנסתי לכיתה</button>
  <button id="btnSkip">דלג</button>
</section>

<!-- מסך סיום -->
<section id="win" class="screen hidden">
  <h1>האש כובתה!</h1>
  <p class="sub" id="winTime"></p>
  <button id="btnAgain" class="big">שחק שוב</button>
</section>

<script src="vendor/tf.min.js?v=7"></script>
<script src="js/orient.js?v=7"></script>
<script src="js/recognizer.js?v=7"></script>
<script src="js/audio.js?v=7"></script>
<script src="vendor/three.min.js?v=7"></script>
<script src="js/flames.js?v=7"></script>
<script src="js/fx.js?v=7"></script>
<script src="js/main.js?v=7"></script>
</body>
</html>
